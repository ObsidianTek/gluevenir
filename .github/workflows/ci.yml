name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: required
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Format and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Offline tests
        run: uv run pytest
      - name: Repository, evidence, and dependency checks
        run: uv run python scripts/verify_repository.py
      - name: Package build and import
        run: |
          uv build
          uv run --isolated --no-project --with ./dist/*.whl python -c "import gluevenir"
