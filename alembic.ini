[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
output_encoding = utf-8

[post_write_hooks]
hooks = ruff-format, ruff-check
ruff-format.type = module
ruff-format.module = ruff
ruff-format.options = format REVISION_SCRIPT_FILENAME
ruff-check.type = module
ruff-check.module = ruff
ruff-check.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
