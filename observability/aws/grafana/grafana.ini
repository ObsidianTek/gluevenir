[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[auth]
disable_login_form = true
disable_signout_menu = true

[auth.anonymous]
enabled = false
org_name = Main Org.
org_role = Viewer
hide_version = true

[alerting]
enabled = false

[dashboards]
min_refresh_interval = 5s
versions_to_keep = 1

[explore]
enabled = false

[feature_toggles]
publicDashboardsScene = false

[log]
level = warn

[public_dashboards]
enabled = true

[security]
allow_embedding = true
cookie_samesite = strict
cookie_secure = true
disable_gravatar = true
hide_version = true
strict_transport_security = true

[server]
domain = localhost
enable_gzip = true
http_addr = 127.0.0.1
http_port = 3000
protocol = http
root_url = %(protocol)s://%(domain)s/
router_logging = false
serve_from_sub_path = false

[snapshots]
enabled = false
external_enabled = false

[users]
allow_sign_up = false
default_theme = dark
viewers_can_edit = false

[unified_alerting]
enabled = false
